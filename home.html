<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Loan Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-[#f0f9f4] min-h-screen p-6 flex flex-col items-center">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-6 mb-6">
        <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center">
            <span class="bg-emerald-100 text-emerald-600 p-2 rounded-lg mr-2">📊</span> คํานวณเงินกู้
        </h2>
        <div class="space-y-4">
            <div>
                <label class="block text-slate-600 text-sm mb-1">เงินต้น (บาท)</label>
                <input type="number" id="principal" class="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-400" value="100000">
            </div>
            <div>
                <label class="block text-slate-600 text-sm mb-1">อัตราดอกเบี้ยต่อปี (%)</label>
                <input type="number" step="0.01" id="rate" class="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-400" value="7">
            </div>
            <div>
                <label class="block text-slate-600 text-sm mb-1">ระยะเวลาผ่อน (เดือน)</label>
                <input type="number" id="months" class="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-400" value="12">
            </div>
        </div>
    </div>

    <div class="bg-emerald-500 w-full max-w-md rounded-2xl shadow-lg p-6 text-white space-y-6">
        <div>
            <p class="text-emerald-100 text-xs mb-1 uppercase font-bold">ค่างวดต่อเดือน</p>
            <h3 class="text-4xl font-bold" id="monthly_pay">฿0.00</h3>
        </div>
        <button onclick="saveData()" class="w-full py-3 bg-white text-emerald-600 font-bold rounded-xl hover:bg-emerald-50 shadow-lg">
            💾 บันทึกประวัติลง Database
        </button>
    </div>

    <script>
        function calculate() {
            const p = parseFloat(document.getElementById('principal').value) || 0;
            const r = parseFloat(document.getElementById('rate').value) || 0;
            const m = parseFloat(document.getElementById('months').value) || 0;
            const interest = p * (r / 100) * (m / 12);
            const total = p + interest;
            const monthly = m > 0 ? total / m : 0;
            document.getElementById('monthly_pay').innerText = '฿' + monthly.toLocaleString(undefined, {minimumFractionDigits: 2});
            return { p, r, m, monthly };
        }

        // ฟังก์ชันส่งค่าไปหา PHP โดยไม่เปลี่ยนหน้า
        function saveData() {
            const data = calculate();
            const formData = new FormData();
            formData.append('p', data.p);
            formData.append('r', data.r);
            formData.append('m', data.m);
            formData.append('pay', data.monthly);

            fetch('db_save.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(result => {
                alert(result); // โชว์ข้อความที่ตอบกลับมาจาก PHP
            })
            .catch(error => alert('เกิดข้อผิดพลาด: ' + error));
        }

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', calculate);
        });
        calculate();
    </script>
</body>
</html>-
